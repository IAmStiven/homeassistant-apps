name: Threadfin
version: "0.1.0"
slug: threadfin
description: M3U proxy for Plex DVR, Emby, and Jellyfin Live TV
url: "https://github.com/IAmStiven/homeassistant-apps/tree/main/threadfin"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
webui: "http://[HOST]:[PORT:34400]"
panel_icon: mdi:playlist-play
map:
  - share:rw
ports:
  34400/tcp: 34400
ports_description:
  34400/tcp: Threadfin web interface
options:
  bind_address: 0.0.0.0
  port: 34400
  branch: main
  debug: 0
  timezone: UTC
schema:
  bind_address: str
  port: port
  branch: list(main|beta)
  debug: int(0,3)
  timezone: str
# image: "ghcr.io/iamstiven/{arch}-addon-threadfin"
