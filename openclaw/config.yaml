name: OpenClaw
version: "0.1.0"
slug: openclaw
description: Personal AI assistant gateway using Bun
url: "https://github.com/IAmStiven/homeassistant-apps/tree/main/openclaw"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
webui: "http://[HOST]:[PORT:18789]"
panel_icon: mdi:robot-outline
map:
  - share:rw
ports:
  18789/tcp: 18789
ports_description:
  18789/tcp: OpenClaw dashboard and gateway
options:
  gateway_bind: lan
  gateway_port: 18789
  gateway_token: ""
  log_level: info
schema:
  gateway_bind: list(loopback|lan)
  gateway_port: port
  gateway_token: str?
  log_level: list(debug|info|warn|error)
# Set this after publishing images. While developing locally, omit or comment it out.
# image: "ghcr.io/iamstiven/{arch}-addon-openclaw"
